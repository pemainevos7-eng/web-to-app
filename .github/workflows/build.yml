
name: ZORA BUILDER APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Nama aplikasi
        required: true
        type: string
      package_name:
        description: Package identifier
        required: true
        type: string
      website_url:
        description: URL website
        required: true
        type: string
      icon_base64:
        description: Ikon aplikasi dalam Base64
        required: false
        type: string
      splash_base64:
        description: Gambar loading screen dalam Base64
        required: false
        type: string
      orientation:
        description: Orientasi aplikasi
        required: true
        type: choice
        options:
          - portrait
          - landscape
      version_name:
        description: Versi aplikasi
        required: true
        default: '1.0.0'
        type: string
      theme_color:
        description: Warna background splash
        required: true
        default: '#101114'
        type: string
      splash_duration:
        description: Durasi splash dalam milidetik
        required: true
        default: '2000'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image processor
        run: pip install pillow

      - name: Validate and generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
          ICON_BASE64: ${{ inputs.icon_base64 }}
          SPLASH_BASE64: ${{ inputs.splash_base64 }}
          ORIENTATION: ${{ inputs.orientation }}
          VERSION_NAME: ${{ inputs.version_name }}
          THEME_COLOR: ${{ inputs.theme_color }}
          SPLASH_DURATION: ${{ inputs.splash_duration }}
        run: |
          python3 - <<'PY'
          import os, re, json, base64
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps, ImageDraw
          from xml.sax.saxutils import quoteattr

          name = os.environ["APP_NAME"].strip()
          package = os.environ["PACKAGE_NAME"].strip()
          url = os.environ["WEBSITE_URL"].strip()
          orientation = os.environ["ORIENTATION"]
          version = os.environ["VERSION_NAME"].strip()
          color = os.environ["THEME_COLOR"].strip()
          duration = int(os.environ["SPLASH_DURATION"])

          if not name or len(name) > 40:
              raise SystemExit("Nama aplikasi tidak valid")

          if not re.fullmatch(
              r'[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+',
              package
          ):
              raise SystemExit("Package name tidak valid")

          if not re.fullmatch(r'https?://[^ ]+', url):
              raise SystemExit("URL website tidak valid")

          if orientation not in ("portrait", "landscape"):
              raise SystemExit("Orientasi tidak valid")

          if not re.fullmatch(r'[A-Za-z0-9._-]{1,20}', version):
              raise SystemExit("Versi aplikasi tidak valid")

          if not re.fullmatch(r'#[0-9a-fA-F]{6}', color):
              raise SystemExit("Warna tema tidak valid")

          if duration < 0 or duration > 10000:
              raise SystemExit("Durasi splash maksimal 10000 ms")

          root = Path("app/src/main")
          package_path = root / "java" / package.replace(".", "/")
          package_path.mkdir(parents=True, exist_ok=True)

          def decode_image(value):
              if not value:
                  return None
              if len(value) > 25000:
                  raise SystemExit("Ukuran gambar terlalu besar")
              if "," in value and value.startswith("data:"):
                  value = value.split(",", 1)[1]
              try:
                  raw = base64.b64decode(value, validate=True)
                  img = Image.open(BytesIO(raw))
                  img.load()
                  return img.convert("RGBA")
              except Exception:
                  raise SystemExit("Format gambar tidak valid")

          icon = decode_image(os.environ.get("ICON_BASE64", ""))
          splash = decode_image(os.environ.get("SPLASH_BASE64", ""))

          # Generate default icon jika pengguna tidak mengunggah ikon
          if icon is None:
              icon = Image.new("RGBA", (512, 512), "#101114")
              draw = ImageDraw.Draw(icon)
              draw.rounded_rectangle(
                  (55, 55, 457, 457),
                  radius=100,
                  fill="#292c35"
              )
              draw.text((180, 185), "Z", fill="white")

          # Generate default splash jika tidak ada gambar
          if splash is None:
              splash = Image.new("RGBA", (1080, 1920), color)
              draw = ImageDraw.Draw(splash)
              draw.text((430, 920), "ZORA", fill="white")

          # Generate ikon untuk semua density Android
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = root / "res" / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              output = ImageOps.fit(icon, (size, size))
              output.save(folder / "ic_launcher.png")

          # Splash screen
          drawable = root / "res" / "drawable-nodpi"
          drawable.mkdir(parents=True, exist_ok=True)
          splash = ImageOps.contain(splash, (1080, 1920))
          canvas = Image.new("RGBA", (1080, 1920), color)
          canvas.alpha_composite(
              splash,
              ((1080 - splash.width) // 2,
               (1920 - splash.height) // 2)
          )
          canvas.convert("RGB").save(drawable / "zora_splash.jpg", quality=90)

          Path("settings.gradle").write_text("""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZoraBuilder"
          include ':app'
          """)

          Path("build.gradle").write_text("""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """)

          Path("gradle.properties").write_text("""
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          """)

          Path("app/build.gradle").write_text(f"""
          plugins {{
              id 'com.android.application'
          }}

          android {{
              namespace '{package}'
              compileSdk 35

              defaultConfig {{
                  applicationId '{package}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '{version}'
              }}
          }}
          """)

          manifest = f"""
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label={quoteattr(name)}
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="{orientation}">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          (root / "AndroidManifest.xml").write_text(manifest)

          java = f"""
          package {package};

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {{
              private WebView web;

              private void openWebsite() {{
                  web = new WebView(this);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  web.loadUrl({json.dumps(url)});

                  setContentView(web);
              }}

              @Override
              protected void onCreate(Bundle state) {{
                  super.onCreate(state);

                  ImageView splash = new ImageView(this);
                  splash.setImageResource(
                      getResources().getIdentifier(
                          "zora_splash", "drawable", getPackageName()
                      )
                  );
                  splash.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  splash.setBackgroundColor(Color.parseColor("{color}"));

                  FrameLayout layout = new FrameLayout(this);
                  layout.addView(
                      splash,
                      new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          Gravity.CENTER
                      )
                  );

                  setContentView(layout);

                  new Handler().postDelayed(
                      this::openWebsite,
                      {duration}
                  );
              }}

              @Override
              public void onBackPressed() {{
                  if (web != null && web.canGoBack()) {{
                      web.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          """

          (package_path / "MainActivity.java").write_text(java)
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
            "output/${{ inputs.app_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-BUILDER-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
          

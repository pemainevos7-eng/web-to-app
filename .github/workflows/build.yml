
name: ZORA BUILDER APK

run-name: ZORA BUILD - ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Build request ID"
        required: true
        type: string

      app_name:
        description: "Nama aplikasi"
        required: true
        type: string

      package_name:
        description: "Package name"
        required: true
        type: string

      website_url:
        description: "URL website"
        required: true
        type: string

      icon_base64:
        description: "Icon image base64"
        required: false
        type: string

      splash_base64:
        description: "Splash image base64"
        required: false
        type: string

      orientation:
        description: "Orientasi aplikasi"
        required: true
        type: choice
        options:
          - portrait
          - landscape

      version_name:
        description: "Versi aplikasi"
        required: true
        type: string

      theme_color:
        description: "Warna tema HEX"
        required: true
        type: string

      splash_duration:
        description: "Durasi splash dalam milidetik"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
          ICON_BASE64: ${{ inputs.icon_base64 }}
          SPLASH_BASE64: ${{ inputs.splash_base64 }}
          ORIENTATION: ${{ inputs.orientation }}
          VERSION_NAME: ${{ inputs.version_name }}
          THEME_COLOR: ${{ inputs.theme_color }}
          SPLASH_DURATION: ${{ inputs.splash_duration }}
        run: |
          python3 -m pip install --quiet Pillow

          python3 <<'PY'
          import os, re, json, base64
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          app_name = os.environ["APP_NAME"]
          package = os.environ["PACKAGE_NAME"]
          url = os.environ["WEBSITE_URL"]
          orientation = os.environ["ORIENTATION"]
          version = os.environ["VERSION_NAME"]
          color = os.environ["THEME_COLOR"]
          duration = int(os.environ["SPLASH_DURATION"])

          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", package):
              raise ValueError("Package name tidak valid")

          if not re.fullmatch(r"#[0-9a-fA-F]{6}", color):
              raise ValueError("Warna tema harus HEX, contoh #202020")

          if orientation not in ("portrait", "landscape"):
              raise ValueError("Orientasi tidak valid")

          if not re.match(r"^https?://", url):
              raise ValueError("URL harus diawali http:// atau https://")

          duration = max(0, min(duration, 10000))

          root = Path("android-project")
          app = root / "app"
          src = app / "src/main"
          java_package = package.replace(".", "/")
          java_dir = src / "java" / java_package

          java_dir.mkdir(parents=True, exist_ok=True)
          (src / "res").mkdir(parents=True, exist_ok=True)

          def decode_image(value):
              if not value:
                  return None
              if "," in value and value.startswith("data:"):
                  value = value.split(",", 1)[1]
              return Image.open(
                  __import__("io").BytesIO(base64.b64decode(value))
              ).convert("RGBA")

          icon = decode_image(os.environ.get("ICON_BASE64", ""))
          splash = decode_image(os.environ.get("SPLASH_BASE64", ""))

          # Generate launcher icons
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              out = src / "res" / folder
              out.mkdir(parents=True, exist_ok=True)

              if icon:
                  image = ImageOps.fit(icon, (size, size))
              else:
                  image = Image.new("RGBA", (size, size), color)
                  draw = ImageDraw.Draw(image)
                  draw.ellipse(
                      (size*.2, size*.2, size*.8, size*.8),
                      fill="white"
                  )

              image.save(out / "ic_launcher.png")

          # Generate splash image
          splash_dir = src / "res/drawable-nodpi"
          splash_dir.mkdir(parents=True, exist_ok=True)

          if splash:
              splash = ImageOps.contain(splash, (1080, 1920))
              canvas = Image.new("RGBA", (1080, 1920), color)
              canvas.alpha_composite(
                  splash,
                  ((1080-splash.width)//2, (1920-splash.height)//2)
              )
          else:
              canvas = Image.new("RGBA", (1080, 1920), color)

          canvas.save(splash_dir / "splash.png")

          # Gradle settings
          (root / "settings.gradle").write_text("""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ZoraBuilder"
          include(":app")
          """)

          (root / "build.gradle").write_text("""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """)

          (root / "gradle.properties").write_text("""
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          android.useAndroidX=true
          """)

          (app / "build.gradle").write_text(f"""
          plugins {{
              id 'com.android.application'
          }}

          android {{
              namespace '{package}'
              compileSdk 35

              defaultConfig {{
                  applicationId '{package}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '{version}'
              }}
          }}
          """)

          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="false"
                  android:label={json.dumps(app_name)}
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="{orientation}"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          (src / "AndroidManifest.xml").write_text(manifest)

          java_code = f"""
          package {package};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.graphics.Color;
          import android.graphics.Bitmap;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.Drawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.WebResourceRequest;

          public class MainActivity extends Activity {{

              private WebView web;
              private FrameLayout root;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.parseColor("{color}"));
                  getWindow().setNavigationBarColor(Color.BLACK);

                  root = new FrameLayout(this);

                  web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setDatabaseEnabled(true);
                  web.getSettings().setLoadsImagesAutomatically(true);
                  web.getSettings().setSupportZoom(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());

                  root.addView(web);

                  ImageView splash = new ImageView(this);
                  splash.setImageResource(
                      getResources().getIdentifier(
                          "splash", "drawable", getPackageName()
                      )
                  );
                  splash.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  splash.setBackgroundColor(Color.parseColor("{color}"));

                  root.addView(splash);
                  setContentView(root);

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {{
                      if (splash.getParent() != null) {{
                          root.removeView(splash);
                      }}
                      web.loadUrl({json.dumps(url)});
                  }}, {duration});
              }}

              @Override
              public void onBackPressed() {{
                  if (web != null && web.canGoBack()) {{
                      web.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          """

          (java_dir / "MainActivity.java").write_text(java_code)

          print("Android project berhasil dibuat")
          PY

      - name: Build APK
        working-directory: android-project
        run: |
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          mkdir -p output

          APP_SLUG=$(echo "$APP_NAME" | tr ' ' '-' | tr -cd 'A-Za-z0-9_-')
          VERSION_SLUG=$(echo "$VERSION_NAME" | tr -cd 'A-Za-z0-9._-')

          cp android-project/app/build/outputs/apk/debug/app-debug.apk \
            "output/${APP_SLUG}-${VERSION_SLUG}.apk"

          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORA-BUILDER-${{ inputs.request_id }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
          
